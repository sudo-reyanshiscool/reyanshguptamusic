<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music by RG</title>
<meta name="description" content="Music projects by RG, starting with Loamlight: a fifteen-track game soundtrack made entirely by code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="gate">

<header class="hero">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="hero-text">
    <h1><a href="#">Music by RG</a></h1>
    <p>Come in out of the rain. Everything I make ends up here.</p>
    <button id="enter" class="pixel-btn enter" type="button">Enter</button>
    <button id="rain-toggle" class="pixel-btn quiet" type="button" aria-pressed="false">Turn rain sound on</button>
  </div>
</header>
<div id="flash" class="flash" aria-hidden="true"></div>

<main id="projects"></main>

<footer class="foot">
  <p>More projects will land here as they're finished.</p>
</footer>

<div id="player" class="player" hidden>
  <div class="player-inner">
    <div class="controls">
      <button id="prev" type="button" aria-label="Previous track">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1h2v10H1zM11 1v10H9V9H7V7H5V5h2V3h2V1z"/></svg>
      </button>
      <button id="toggle" class="big" type="button" aria-label="Play">
        <svg id="icon-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h2v2h2v2h2v2H6v2H4v2H2z"/></svg>
        <svg id="icon-pause" viewBox="0 0 12 12" aria-hidden="true" hidden><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>
      </button>
      <button id="next" type="button" aria-label="Next track">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M9 1h2v10H9zM1 1v10h2V9h2V7h2V5H5V3H3V1z"/></svg>
      </button>
    </div>
    <div class="now">
      <strong id="now-title"></strong>
      <span id="now-where"></span>
    </div>
    <div class="seek">
      <span id="time-now">0:00</span>
      <input id="seek" type="range" min="0" max="100" value="0" step="1" aria-label="Position in track">
      <span id="time-total">0:00</span>
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>
<script src="projects.js"></script>
<script src="instruments.js"></script>
<script src="site.js"></script>
</body>
</html>
